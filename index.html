<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogos de clique - 1º ano</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Trebuchet MS", Verdana, sans-serif;
    background: #F4F5FB; color: #2A3081;
    display: flex; flex-direction: column;
  }
  header {
    background: #2A3081; color: #fff; padding: 9px 16px;
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  header h1 { font-size: 18px; letter-spacing: .5px; white-space: nowrap; }
  #placar {
    background: #FFD900; color: #2A3081; font-weight: bold;
    font-size: 19px; border-radius: 10px; padding: 6px 15px; white-space: nowrap;
  }
  .niveis { display: flex; gap: 5px; margin-left: auto; flex-wrap: wrap; }
  .niveis button {
    font: inherit; font-size: 15px; font-weight: bold;
    background: #4048A8; color: #fff; border: 3px solid transparent;
    border-radius: 9px; padding: 6px 12px; cursor: pointer;
  }
  .niveis button.on { background: #FFD900; color: #2A3081; }
  .niveis button:hover { border-color: #FFD900; }
  #dica {
    text-align: center; font-size: 21px; padding: 9px;
    background: #fff; border-bottom: 3px solid #E3E5F2; flex-shrink: 0;
  }
  #palco { position: relative; flex: 1; overflow: hidden; }

  .alvo {
    position: absolute; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    user-select: none; box-shadow: 0 5px 0 rgba(0,0,0,.13);
    transition: transform .07s;
  }
  .alvo:hover { transform: scale(1.07); }
  .alvo.quadrado { border-radius: 16px; }
  .alvo.meio { outline: 6px dashed #fff; outline-offset: -13px; }

  .cesta {
    position: absolute; border: 7px dashed #2A3081; border-radius: 18px;
    background: rgba(255,217,0,.22);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: bold; text-align: center; padding: 8px;
  }

  /* nivel de segurar apertado */
  .copo {
    position: absolute; border: 7px solid #2A3081;
    border-radius: 10px 10px 20px 20px; background: #fff;
    overflow: hidden; cursor: pointer; user-select: none;
    box-shadow: 0 5px 0 rgba(0,0,0,.13);
  }
  .copo.enchendo { border-color: #2F9E44; }
  .liquido {
    position: absolute; left: 0; bottom: 0; width: 100%; height: 0%;
    background: linear-gradient(#4DABF7, #1C7ED6);
  }
  .copo.enchendo .liquido { background: linear-gradient(#69DB7C, #2F9E44); }
  .rotulo {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    font-size: 34px; pointer-events: none;
  }

  .pop {
    position: absolute; pointer-events: none; font-size: 46px;
    animation: sobe .55s ease-out forwards;
  }
  @keyframes sobe { to { transform: translateY(-70px) scale(1.5); opacity: 0; } }

  #festa {
    position: absolute; inset: 0; display: none; z-index: 10;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(255,255,255,.96); gap: 22px; text-align: center; padding: 20px;
  }
  #festa .txt { font-size: 46px; font-weight: bold; }
  #festa .linha { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  #festa button {
    font: inherit; font-size: 23px; font-weight: bold;
    border: none; border-radius: 14px; padding: 15px 30px; cursor: pointer;
  }
  #btProximo { background: #2F9E44; color: #fff; }
  #btDenovo  { background: #2A3081; color: #fff; }
  #festa button:hover { filter: brightness(1.12); }
</style>
</head>
<body>

<header>
  <h1>JOGOS DE CLIQUE</h1>
  <div id="placar">0 / 10</div>
  <div class="niveis" id="niveis"></div>
</header>

<div id="dica">Clique nas bolas grandes!</div>
<div id="palco"><div id="festa"></div></div>

<script>
(function () {
  var palco    = document.getElementById('palco');
  var dica     = document.getElementById('dica');
  var placarEl = document.getElementById('placar');
  var festa    = document.getElementById('festa');
  var barra    = document.getElementById('niveis');

  var CORES = ['#E03131','#1C7ED6','#2F9E44','#F08C00','#9C36B5','#0CA678'];
  var CARAS = ['\u2B50','\u2764','\u2600','\u26A1','\u2744','\u273F'];
  var META  = 10;

  var NIVEIS = [
    { n:1, modo:'clicar',   texto:'Clique nas bolas GRANDES!',            tam:[115,145], vel:0,   qtd:4 },
    { n:2, modo:'clicar',   texto:'As bolas ficaram menores. Mire bem!',  tam:[72,95],   vel:0,   qtd:4 },
    { n:3, modo:'clicar',   texto:'Agora bem pequenas! Devagar...',       tam:[42,58],   vel:0,   qtd:5 },
    { n:4, modo:'clicar',   texto:'Cuidado: elas se mexem!',              tam:[78,100],  vel:1.4, qtd:4 },
    { n:5, modo:'clicar',   texto:'Pequenas E rapidas! Voce consegue?',   tam:[46,62],   vel:2.8, qtd:5 },
    { n:6, modo:'encher',   texto:'Segure o botao apertado para encher!', tam:[120,150], vel:0,   qtd:2, passo:2.0 },
    { n:7, modo:'encher',   texto:'Copos menores. Nao deixe a mao tremer!',tam:[74,100], vel:0,   qtd:3, passo:1.6 },
    { n:8, modo:'arrastar', texto:'Arraste as bolinhas ate a caixa!',     tam:[68,68],   vel:0,   qtd:3, cesta:[200,160] },
    { n:9, modo:'duplo',    texto:'Agora clique DUAS vezes bem rapido!',  tam:[105,130], vel:0,   qtd:4 }
  ];

  var nivel = 1, pontos = 0, timers = [], largAnt = 0, altAnt = 0;

  function cfgDe(n) {
    for (var i = 0; i < NIVEIS.length; i++) { if (NIVEIS[i].n === n) return NIVEIS[i]; }
    return NIVEIS[0];
  }
  function aleatorio(a, b) { return a + Math.random() * (b - a); }

  for (var k = 0; k < NIVEIS.length; k++) {
    (function (c) {
      var b = document.createElement('button');
      b.textContent = c.n;
      b.dataset.n = c.n;
      b.onclick = function () { iniciar(c.n); };
      barra.appendChild(b);
    })(NIVEIS[k]);
  }

  function limparAlvos() {
    for (var t = 0; t < timers.length; t++) { clearInterval(timers[t]); }
    timers = [];
    var itens = palco.querySelectorAll('.alvo, .cesta, .copo, .pop');
    for (var i = 0; i < itens.length; i++) { itens[i].remove(); }
  }

  function comemorar() {
    limparAlvos();
    var temProximo = nivel < NIVEIS.length;
    festa.innerHTML =
      '<div class="txt">\uD83C\uDF89 MUITO BEM! \uD83C\uDF89</div>' +
      '<div class="linha">' +
        (temProximo ? '<button id="btProximo">PROXIMO NIVEL \u2192</button>' : '') +
        '<button id="btDenovo">JOGAR DE NOVO</button>' +
      '</div>' +
      (temProximo ? '' : '<div style="font-size:22px">Voce terminou todos os niveis!</div>');
    festa.style.display = 'flex';
    if (temProximo) {
      document.getElementById('btProximo').onclick = function () { iniciar(nivel + 1); };
    }
    document.getElementById('btDenovo').onclick = function () { iniciar(nivel); };
  }

  function ponto(x, y) {
    pontos++;
    placarEl.textContent = pontos + ' / ' + META;
    var p = document.createElement('div');
    p.className = 'pop';
    p.textContent = '\u2B50';
    p.style.left = (x - 22) + 'px';
    p.style.top  = (y - 22) + 'px';
    palco.appendChild(p);
    setTimeout(function () { p.remove(); }, 560);
    if (pontos >= META) { comemorar(); }
  }

  function centroDe(el) {
    var r = el.getBoundingClientRect(), rp = palco.getBoundingClientRect();
    return { x: r.left - rp.left + r.width / 2, y: r.top - rp.top + r.height / 2 };
  }

  function posicionar(el, w, h) {
    el.style.left = aleatorio(8, Math.max(12, palco.clientWidth  - w - 8)) + 'px';
    el.style.top  = aleatorio(8, Math.max(12, palco.clientHeight - h - 8)) + 'px';
  }

  function novoAlvo(cfg) {
    var d = aleatorio(cfg.tam[0], cfg.tam[1]);
    var a = document.createElement('div');
    a.className = 'alvo' + (Math.random() < 0.25 ? ' quadrado' : '');
    a.style.width = a.style.height = d + 'px';
    a.style.background = CORES[Math.floor(Math.random() * CORES.length)];
    a.style.fontSize = Math.max(15, d * 0.42) + 'px';
    a.textContent = CARAS[Math.floor(Math.random() * CARAS.length)];
    posicionar(a, d, d);
    var v = cfg.vel || 0;
    a.dataset.dx = (Math.random() < .5 ? -1 : 1) * (v ? aleatorio(v * .6, v) : 0);
    a.dataset.dy = (Math.random() < .5 ? -1 : 1) * (v ? aleatorio(v * .6, v) : 0);
    palco.appendChild(a);
    return a;
  }

  function animar() {
    timers.push(setInterval(function () {
      var todos = palco.querySelectorAll('.alvo');
      for (var i = 0; i < todos.length; i++) {
        var a = todos[i];
        var x = parseFloat(a.style.left), y = parseFloat(a.style.top);
        var dx = parseFloat(a.dataset.dx), dy = parseFloat(a.dataset.dy);
        var d = a.offsetWidth;
        x += dx; y += dy;
        if (x < 0 || x > palco.clientWidth  - d) { dx = -dx; x += dx * 2; }
        if (y < 0 || y > palco.clientHeight - d) { dy = -dy; y += dy * 2; }
        a.style.left = x + 'px'; a.style.top = y + 'px';
        a.dataset.dx = dx; a.dataset.dy = dy;
      }
    }, 30));
  }

  function modoClicar(cfg) {
    function criar() {
      var a = novoAlvo(cfg);
      a.addEventListener('click', function () {
        if (pontos >= META) { return; }
        var c = centroDe(a);
        a.remove();
        ponto(c.x, c.y);
        if (pontos < META) { criar(); }
      });
    }
    for (var i = 0; i < cfg.qtd; i++) { criar(); }
    if (cfg.vel) { animar(); }
  }

  function modoDuplo(cfg) {
    function criar() {
      var a = novoAlvo(cfg);
      a.className += ' meio';
      a.addEventListener('dblclick', function () {
        if (pontos >= META) { return; }
        var c = centroDe(a);
        a.remove();
        ponto(c.x, c.y);
        if (pontos < META) { criar(); }
      });
      a.addEventListener('click', function () {
        a.style.transform = 'scale(1.15)';
        setTimeout(function () { a.style.transform = ''; }, 120);
      });
    }
    for (var i = 0; i < cfg.qtd; i++) { criar(); }
  }

  function modoEncher(cfg) {
    var w = cfg.tam[0], h = cfg.tam[1];
    var passo = cfg.passo || 2.0;   // % por tique de 30ms

    function criar() {
      var box = document.createElement('div');
      box.className = 'copo';
      box.style.width = w + 'px';
      box.style.height = h + 'px';
      posicionar(box, w, h);

      var liq = document.createElement('div');
      liq.className = 'liquido';
      box.appendChild(liq);

      var rot = document.createElement('div');
      rot.className = 'rotulo';
      rot.textContent = '\uD83D\uDCA7';
      box.appendChild(rot);

      palco.appendChild(box);

      var cheio = 0, segurando = false;

      function comecar(e) {
        if (pontos >= META) { return; }
        e.preventDefault();
        segurando = true;
        box.className = 'copo enchendo';
      }
      function parar() {
        segurando = false;
        if (box.parentNode) { box.className = 'copo'; }
      }

      box.addEventListener('mousedown', comecar);
      box.addEventListener('mouseleave', parar);
      document.addEventListener('mouseup', parar);

      var t = setInterval(function () {
        if (!segurando) { return; }
        cheio += passo;
        if (cheio >= 100) {
          clearInterval(t);
          document.removeEventListener('mouseup', parar);
          var c = centroDe(box);
          box.remove();
          ponto(c.x, c.y);
          if (pontos < META) { criar(); }
          return;
        }
        liq.style.height = cheio + '%';
      }, 30);
      timers.push(t);
    }

    for (var i = 0; i < cfg.qtd; i++) { criar(); }
  }

  function modoArrastar(cfg) {
    var cw = cfg.cesta[0], ch = cfg.cesta[1];
    var cesta = document.createElement('div');
    cesta.className = 'cesta';
    cesta.textContent = 'SOLTE AQUI';
    cesta.style.width = cw + 'px';
    cesta.style.height = ch + 'px';
    cesta.style.left = Math.max(10, palco.clientWidth - cw - 40) + 'px';
    cesta.style.top  = Math.max(10, palco.clientHeight / 2 - ch / 2) + 'px';
    palco.appendChild(cesta);

    function criar() {
      var a = novoAlvo(cfg);
      a.style.left = aleatorio(20, Math.max(30, palco.clientWidth * 0.42)) + 'px';
      a.style.cursor = 'grab';
      a.addEventListener('mousedown', function (e) {
        if (pontos >= META) { return; }
        e.preventDefault();
        a.style.cursor = 'grabbing';
        var rp = palco.getBoundingClientRect();
        var ra = a.getBoundingClientRect();
        var offX = e.clientX - ra.left, offY = e.clientY - ra.top;
        function mover(ev) {
          a.style.left = (ev.clientX - rp.left - offX) + 'px';
          a.style.top  = (ev.clientY - rp.top  - offY) + 'px';
        }
        function soltar() {
          document.removeEventListener('mousemove', mover);
          document.removeEventListener('mouseup', soltar);
          a.style.cursor = 'grab';
          var rc = cesta.getBoundingClientRect(), rr = a.getBoundingClientRect();
          var cx = rr.left + rr.width / 2, cy = rr.top + rr.height / 2;
          if (cx > rc.left && cx < rc.right && cy > rc.top && cy < rc.bottom) {
            var c = centroDe(cesta);
            a.remove();
            ponto(c.x, c.y);
            if (pontos < META) { criar(); }
          }
        }
        document.addEventListener('mousemove', mover);
        document.addEventListener('mouseup', soltar);
      });
    }
    for (var i = 0; i < cfg.qtd; i++) { criar(); }
  }

  function iniciar(n) {
    nivel = n; pontos = 0;
    placarEl.textContent = '0 / ' + META;
    festa.style.display = 'none';
    limparAlvos();
    var cfg = cfgDe(n);
    dica.textContent = cfg.texto;
    var bts = barra.querySelectorAll('button');
    for (var i = 0; i < bts.length; i++) {
      bts[i].className = (+bts[i].dataset.n === n) ? 'on' : '';
    }
    largAnt = palco.clientWidth; altAnt = palco.clientHeight;
    if (cfg.modo === 'arrastar') { modoArrastar(cfg); }
    else if (cfg.modo === 'duplo') { modoDuplo(cfg); }
    else if (cfg.modo === 'encher') { modoEncher(cfg); }
    else { modoClicar(cfg); }
  }

  window.addEventListener('resize', function () {
    if (Math.abs(palco.clientWidth - largAnt) > 60 ||
        Math.abs(palco.clientHeight - altAnt) > 60) { iniciar(nivel); }
  });

  iniciar(1);
})();
</script>
</body>
</html>
